<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDESI</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="../scripts/script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>PokeDesi</h1>
    </header>

    <main>
        <img class="offline" src="../assets/pokeDesi.jpg" alt="Esperando">
        <button id="comecar" class="btn btn-danger btn-lg fw-bold shadow">
            Começar a Aventura! 🎮
        </button>

        <input id="pesquisa" class="form-control me-2" type="search" placeholder="🔍 Pesquise..." aria-label="Search"/>

        <div id="appeared"></div>
    </main>

    <div class="modal fade" id="modalPokemon" tabindex="-1" aria-labelledby="modalPokemonLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPokemonLabel">nome do pokemon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div>
                    <img id="imagem" src="" alt="Imagem do Pokémon">
                    <p id="tipo">Tipo 🧬: </p>
                    <p id="peso">Peso ⚖️: </p>
                    <p id="altura">Altura 📏: </p>
                </div>
                <div class="modal-body" id="modalPokemonBody">
                    <p id="vida"><strong>HP (Pontos de vida ❤️): </strong></p>
                    <p id="ataque"><strong>ATK (Ataque ⚔️): </strong></p>
                    <p id="defesa"><strong>DEF (Defesa 🛡️): </strong></p>
                    <p id="velocidade"><strong>SPEED (Velocidade 👟): </strong></p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        copyright: NINTENDO 2027
    </footer>
</body>
</html>
